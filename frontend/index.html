<!doctype html>
<html lang="en"><head><meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WayFinder Campus Navigation Guide" />
    <script>
      try {
        const savedTheme = localStorage.getItem('wayfinder-theme');
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.classList.add('dark');
      }
    </script>
    <title>WayFinder | Campus Navigation</title></head><body><div id="root">
        
    </div><script type="module" src="/src/main.jsx"></script></body></html>
